name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题？
      description: 请描述场景，而不是直接给方案。例如「我在 …情况下，很难 …」
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它方案（选填）
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 请确认
      options:
        - label: 这个建议不涉及上传用户数据
          required: false
        - label: 我已经搜索过现有 Issue，没有重复
          required: true
