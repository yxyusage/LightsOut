name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 单元测试与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 显示环境信息
        run: node --version

      - name: 静态检查（模块解析 / 文档链接 / 预缓存清单 / 时钟不变量 / 文本格式）
        run: node scripts/check.mjs

      - name: 运行单元测试
        run: npm test

      - name: 构建发布产物
        run: node scripts/build.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
