name: Build Android APK

# 用 GitHub Actions 构建 Android APK。
# 动机：开发机没有 Android SDK 且 Maven Central 不可达，无法本地编译；
# 而 GitHub 的 ubuntu runner 自带 JDK 与 Android SDK，把这件工作交给 CI 即可。
#
# 产物：Actions → Artifacts → xideng-debug-apk
# 失败时：构建日志会被推到 ci-logs 分支（仓库匿名可读），便于远程定位问题。

on:
  push:
    branches: [main]
    paths:
      - 'platforms/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'platforms/android/**'
  workflow_dispatch:

# 需要 write 权限：一是把失败的构建日志推到 ci-logs 分支，二是把 APK 发布到 Release
permissions:
  contents: write

jobs:
  build-apk:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    # 签名相关 Secret 在 job 级注入：GitHub 不允许在 step 的 if 里直接引用 secrets
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 环境自检
        if: always()
        run: |
          echo '===== java ====='; java -version 2>&1 || true
          echo '===== gradle ====='; gradle --version 2>&1 | head -12 || true
          echo '===== SDK ====='
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          for d in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk; do
            [ -n "$d" ] && [ -d "$d" ] && { echo "存在: $d"; ls "$d"; }
          done

      - name: 解析 SDK 路径并写入 local.properties
        working-directory: platforms/android
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo '找不到 Android SDK 目录'; exit 1; fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "SDK=$SDK"

      - name: 补齐 Gradle Wrapper
        working-directory: platforms/android
        run: |
          cat gradle/wrapper/gradle-wrapper.properties || true
          gradle wrapper --gradle-version 8.9 --no-daemon
          chmod +x gradlew

      # 用固定密钥签名。
      # 不配置的话 Android 会给每次构建生成一个新的 debug 密钥，用户装新版时必然
      # 遇到 INSTALL_FAILED_UPDATE_INCOMPATIBLE（必须先卸载，数据全丢）。
      # 未配置 Secret 时这一步跳过，构建照常走默认 debug 密钥 —— 不会让流水线挂掉。
      - name: 配置固定签名
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        working-directory: platforms/android
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/xideng.jks
          if [ ! -s /tmp/xideng.jks ]; then echo '密钥还原失败（base64 内容不对？）'; exit 1; fi
          cat > keystore.properties <<EOF
          storeFile=/tmp/xideng.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
          echo '已配置固定签名'
          keytool -list -keystore /tmp/xideng.jks -storepass "$SIGNING_STORE_PASSWORD" | sed -n '3,6p' || true

      # 把构建输出同时写进文件，失败时才能把日志带出 CI。
      - name: 构建 Debug APK
        id: build
        working-directory: platforms/android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log

      - name: 判定构建结果
        working-directory: platforms/android
        run: |
          if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            echo 'BUILD_OK=1' >> "$GITHUB_ENV"
            echo '构建成功，已产出 APK'
            # 打印实际签名指纹：与"熄灯早睡-签名密钥"里那份核对得上，
            # 才说明这个包以后可以覆盖安装。
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            echo "APK=$APK"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" 2>/dev/null | head -6 || true
          else
            echo 'BUILD_OK=0' >> "$GITHUB_ENV"
            echo '构建失败：没有产出 APK'
            exit 1
          fi

      - name: 收集 APK 信息
        if: always()
        working-directory: platforms/android
        run: |
          echo '===== APK ====='
          find . -name '*.apk' -type f 2>/dev/null | while read -r apk; do
            echo "$apk  ($(du -h "$apk" | cut -f1))"
            AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt 2>/dev/null | sort -V | tail -1)
            [ -n "$AAPT" ] && "$AAPT" dump badging "$apk" 2>/dev/null | head -6 || true
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xideng-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      # 把 APK 发到 Release —— Actions 的 Artifacts 需要登录才能下载，
      # 而 Release 附件任何人都能直接下载（朋友、同事、手机浏览器都可以）。
      - name: 发布到 Release（免登录下载）
        if: always() && hashFiles('platforms/android/app/build/outputs/apk/debug/*.apk') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls platforms/android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "准备发布: $APK"

          # 把签名指纹写进 Release 说明。
          # 这样做是因为 CI 日志对匿名访问是 403，而 Release 说明可以用 API 读到 ——
          # 于是"这一版到底用哪个密钥签的"就成了可核对的事实，而不是一句承诺。
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i "SHA-256" | head -1 | sed 's/^[[:space:]]*//')
          else
            CERTS="（找不到 apksigner，未能读取）"
          fi
          [ -n "$CERTS" ] || CERTS="（读取签名失败）"
          echo "签名: $CERTS"

          SIZE=$(du -h "$APK" | cut -f1)
          COMMIT=$(git rev-parse --short HEAD)
          NOTES="由 GitHub Actions 在 main 分支构建成功后自动更新。

- 提交：$COMMIT
- 版本：1.1.0 (2)
- 体积：$SIZE
- 签名：$CERTS

debug 签名，仅供侧载试用，不能上架应用商店。
**签名指纹固定不变**，因此装过本版之后可以直接覆盖升级，不必先卸载。"
          printf '%s' "$NOTES" > /tmp/notes.md
          # 固定复用同一个标签并每次覆盖，保证 README 里的固定链接永远指向最新构建
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest \
            --title "Android 最新构建（自动发布）" \
            --notes "由 GitHub Actions 在 main 分支构建成功后自动更新。debug 签名，仅供侧载试用，不能上架应用商店。" \
            --prerelease
          gh release edit android-latest --notes-file /tmp/notes.md
          gh release upload android-latest "$APK#app-debug.apk" --clobber
          echo "已发布到 Release: android-latest"

      # 关键：把构建日志推到一个独立分支。
      # GitHub 的日志下载接口对匿名访问返回 403，推到分支后即可匿名读取，
      # 这样即使不在这台机器上也能定位编译错误。
      - name: 失败时把构建日志推到 ci-logs 分支
        if: failure()
        run: |
          if [ ! -f /tmp/build.log ]; then echo '没有日志文件'; exit 0; fi
          {
            echo '# Android 构建日志';
            echo '';
            echo "- 运行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID";
            echo "- 提交: $GITHUB_SHA";
            echo '';
            echo '```';
            tail -c 60000 /tmp/build.log;
            echo '```';
          } > /tmp/BUILD-REPORT.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp /tmp/BUILD-REPORT.md BUILD-REPORT.md
          git add BUILD-REPORT.md
          git commit -m "ci: Android 构建日志（运行 $GITHUB_RUN_ID）"
          git push -f origin ci-logs-tmp:ci-logs
