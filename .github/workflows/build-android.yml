name: Build Android APK

# 用 GitHub Actions 构建 Android APK。
# 动机：开发机没有 Android SDK 且 Maven Central 不可达，无法本地编译；
# 而 GitHub 的 ubuntu runner 自带 JDK 与 Android SDK，把这件工作交给 CI 即可。
# 产物从 Actions 页面的 Artifacts 下载。

on:
  push:
    branches: [main]
    paths:
      - 'platforms/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'platforms/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再使用 android-actions/setup-android：
      # ubuntu runner 镜像本身就预装了 Android SDK，再跑一个下载动作只会多一个失败点。
      - name: 环境自检
        if: always()
        run: |
          echo '===== java ====='
          java -version 2>&1 || true
          echo '===== gradle ====='
          gradle --version 2>&1 | head -20 || true
          echo '===== 环境变量 ====='
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo '===== 常见 SDK 位置 ====='
          for d in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              echo "存在: $d"
              ls "$d" || true
              echo '  platforms:'; ls "$d/platforms" 2>/dev/null || echo '   (无)'
              echo '  build-tools:'; ls "$d/build-tools" 2>/dev/null || echo '   (无)'
            fi
          done

      - name: 解析 SDK 路径并写入 local.properties
        working-directory: platforms/android
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "解析出的 SDK: $SDK"
          if [ ! -d "$SDK" ]; then echo '找不到 Android SDK 目录'; exit 1; fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: 补齐 Gradle Wrapper
        working-directory: platforms/android
        run: |
          # 仓库没有提交 gradle-wrapper.jar（二进制），这里现生成一份。
          # 版本以 gradle-wrapper.properties 里声明的为准。
          cat gradle/wrapper/gradle-wrapper.properties || true
          gradle wrapper --gradle-version 8.9 --no-daemon
          chmod +x gradlew

      - name: 构建 Debug APK
        working-directory: platforms/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集 APK 信息
        if: always()
        working-directory: platforms/android
        run: |
          echo '===== APK 列表 ====='
          find . -name '*.apk' -type f -print0 2>/dev/null | while IFS= read -r -d '' apk; do
            echo "APK: $apk  ($(du -h "$apk" | cut -f1))"
            AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt 2>/dev/null | sort -V | tail -1)
            if [ -n "$AAPT" ]; then "$AAPT" dump badging "$apk" 2>/dev/null | head -8 || true; fi
          done
          echo '===== 编译产物目录 ====='
          find . -path ./build -prune -o -name 'outputs' -type d -print 2>/dev/null || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xideng-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
