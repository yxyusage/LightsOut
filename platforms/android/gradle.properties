# 熄灯早睡 · Gradle 属性
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX 是硬要求（材料/AppCompat 都依赖它）
android.useAndroidX=true
# 只生成模块自己的 R 类，加快编译
android.nonTransitiveRClass=true

# 允许在含非 ASCII 字符的路径下编译。
#
# 仓库路径是「E:\deepseek Harness\熄灯早睡」，中文目录会让 AGP 直接拒绝构建
# （"Your project path contains non-ASCII characters"）。CI 的路径是纯 ASCII 所以从没触发过，
# 但本地编译必须打开这个开关，否则永远只能在 CI 上编。
#
# 官方提供该开关正是为这种情况；产物本身不受路径字符集影响。
android.overridePathCheck=true

kotlin.code.style=official
