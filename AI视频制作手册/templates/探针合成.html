<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>能力探针 · 开工前先跑这个</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:960px;height:540px;overflow:hidden;background:#0b1020;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif}
  #root{position:relative;width:100%;height:100%}

  /* 被玻璃折射的内容：必须真的在动，否则看不出模糊是否生效 */
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen}
  #b1{left:120px;top:60px;width:520px;height:520px;
    background:radial-gradient(circle,rgba(255,55,95,.85),rgba(255,55,95,0) 62%)}
  #b2{left:420px;top:180px;width:520px;height:520px;
    background:radial-gradient(circle,rgba(10,132,255,.85),rgba(10,132,255,0) 62%)}

  /* T1 真玻璃；T2 同填充色但无 backdrop-filter（对照组）*/
  .glass,.flat{position:absolute;border-radius:28px;overflow:hidden;
    background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.055) 46%,rgba(255,255,255,.11));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 24px 60px rgba(0,0,0,.5)}
  .glass{backdrop-filter:blur(30px) saturate(180%) brightness(1.07);
    -webkit-backdrop-filter:blur(30px) saturate(180%) brightness(1.07)}
  /* 镜面描边：mask-composite 遮出 1px 渐变环 */
  .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
    background:linear-gradient(140deg,rgba(255,255,255,.92),rgba(255,255,255,.14) 30%,
      rgba(255,255,255,0) 52%,rgba(255,255,255,.42) 88%,rgba(255,255,255,.75));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

  /* 液态折射：turbulence 位移高光层 */
  #liquid{position:absolute;left:0;top:0;width:260px;height:150px;border-radius:28px;
    background:linear-gradient(105deg,rgba(255,255,255,.55),rgba(255,255,255,.05) 40%,rgba(255,255,255,0));
    filter:url(#fx-liquid);opacity:.9}

  /* squircle 超椭圆（Chrome 139+） */
  #squircle{position:absolute;left:820px;top:120px;width:110px;height:110px;
    background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.35);border-radius:26px;corner-shape:squircle}

  /* T5 墙钟动画（对照组）：如果它**不随 seek 精确复现**，说明 CSS 动画不可用 */
  @keyframes cssSlide{from{transform:translateX(0)}to{transform:translateX(200px)}}
  #cssBox{position:absolute;left:680px;top:250px;width:44px;height:44px;border-radius:8px;
    background:#22d3ee;animation:cssSlide 2s linear both}

  .lbl{position:absolute;font:600 13px/1.4 "SF Mono",Menlo,monospace;color:#e8eefc;
    text-shadow:0 1px 3px rgba(0,0,0,.85)}
</style>
</head>
<body>
<div id="root" data-composition-id="probe" data-start="0" data-duration="2"
     data-width="960" data-height="540" data-fps="30">

  <div class="blob" id="b1"></div>
  <div class="blob" id="b2"></div>

  <!-- T1 真玻璃 + 液态折射 -->
  <div class="glass" style="left:70px;top:150px;width:260px;height:150px">
    <div id="liquid"></div>
  </div>
  <div class="lbl" style="left:74px;top:126px">T1 玻璃: backdrop-filter + 镜像环 + 位移</div>

  <!-- T2 对照组：同填充色，无 backdrop-filter（应能看到后面锐利的色块） -->
  <div class="flat" style="left:370px;top:150px;width:260px;height:150px"></div>
  <div class="lbl" style="left:374px;top:126px">T2 对照: 同色无模糊（应为锐利）</div>

  <!-- T3 GSAP 描边生长 -->
  <svg style="position:absolute;left:70px;top:340px;width:300px;height:120px">
    <path id="t3path" d="M 20 90 C 80 20 160 20 280 80" fill="none" stroke="#5eead4"
          stroke-width="5" stroke-linecap="round" stroke-dasharray="300" stroke-dashoffset="300"/>
  </svg>
  <div class="lbl" style="left:74px;top:316px">T3 GSAP strokeDashoffset（应逐帧生长）</div>

  <!-- T4 GSAP clipPath 揭示 -->
  <div id="t4" style="position:absolute;left:400px;top:370px;font-size:40px;font-weight:700;color:#fbbf24">
    REVEAL</div>
  <div class="lbl" style="left:404px;top:346px">T4 GSAP clipPath inset（应逐帧揭示）</div>

  <!-- T5 墙钟动画对照组 -->
  <div id="cssBox"></div>
  <div class="lbl" style="left:680px;top:226px">T5 CSS keyframes（对照：不可 seek）</div>

  <!-- T6 squircle -->
  <div id="squircle"></div>
  <div class="lbl" style="left:820px;top:96px">T6 corner-shape: squircle</div>

  <!-- 纸纹/噪点：换 seed 即换纹理，便于确定性复现 -->
  <svg style="position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay;pointer-events:none">
    <filter id="fx-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/></filter>
    <rect width="960" height="540" filter="url(#fx-grain)"/>
  </svg>

  <!-- 液态折射滤波器 -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="fx-liquid" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.026" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
</div>

<script src="../assets/vendor/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // 让背景色块移动：玻璃侧会"重新计算模糊"，一眼看出真假
  tl.fromTo("#b1", { x: -80, y: -20 }, { x: 120, y: 40, duration: 2, ease: "none" }, 0);
  tl.fromTo("#b2", { x: 90, y: 30 }, { x: -120, y: -40, duration: 2, ease: "none" }, 0);

  // T3 / T4：GSAP 驱动
  tl.fromTo("#t3path", { strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 2, ease: "none" }, 0);
  tl.fromTo("#t4", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 2, ease: "none" }, 0);

  window.__timelines["probe"] = tl;
  tl.seek(0);
})();
</script>
</body>
</html>
